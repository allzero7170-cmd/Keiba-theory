<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>競馬理論分析メモ</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <p class="eyebrow">スマホ・タブレット対応</p>
    <h1>競馬理論分析メモ</h1>
    <p>コンピ指数・朝イチオッズ・調教データだけで合計点を作り、軸候補・相手候補を自動判定します。</p>
  </header>

  <main class="app-shell">
    <form id="raceForm" class="card" autocomplete="off">
      <section class="section">
        <h2>レース情報</h2>
        <div class="grid two-columns">
          <label>
            日付
            <input type="date" id="raceDate" name="raceDate" />
          </label>
          <label>
            競馬場
            <input type="text" id="venue" name="venue" placeholder="例：東京" />
          </label>
          <label>
            レース番号
            <input type="number" id="raceNumber" name="raceNumber" min="1" max="12" placeholder="例：11" />
          </label>
          <label>
            出走頭数
            <input type="number" id="runnersCount" name="runnersCount" min="5" max="18" placeholder="例：18" />
          </label>
          <label>
            レース名
            <input type="text" id="raceName" name="raceName" placeholder="例：日本ダービー" />
          </label>
        </div>
      </section>

      <section class="section">
        <div class="section-heading compact-heading">
          <div>
            <h2>コンピ・朝イチ・調教 入力</h2>
            <p>コンピ順位1位〜10位に、馬番・馬名、コンピ指数、朝イチ単勝順位、朝イチ複勝順位、調教評価を入れます。</p>
          </div>
        </div>
        <div class="formula-box">
          <strong>合計点</strong>：コンピ順位点 + 階級指数点 + 朝イチ異常点 + 調教点 + 組み合わせボーナス
        </div>
        <div id="compiInputs" class="rank-grid" aria-label="コンピ順位入力"></div>
      </section>

      <section class="section">
        <h2>自動判定</h2>
        <div class="grid indicator-grid">
          <label>
            軸候補（自動）
            <textarea id="autoAxisCandidates" name="autoAxisCandidates" rows="3" readonly placeholder="入力すると自動表示"></textarea>
          </label>
          <label>
            相手候補（自動）
            <textarea id="autoOpponentCandidates" name="autoOpponentCandidates" rows="3" readonly placeholder="入力すると自動表示"></textarea>
          </label>
          <label>
            階級指数一覧（自動）
            <textarea id="classIndex" name="classIndex" rows="4" readonly placeholder="例：5位 7番: +4"></textarea>
          </label>
          <label>
            合計点一覧（自動）
            <textarea id="scoreSummary" name="scoreSummary" rows="5" readonly placeholder="得点順に自動表示"></textarea>
          </label>
        </div>
        <p class="helper-text">第一段階の仮ルールです。実戦結果を見ながら、朝イチ異常・調教評価・階級指数の加点幅を調整していきます。</p>
      </section>

      <section class="section">
        <h2>結論メモ</h2>
        <label>
          軸候補メモ
          <textarea id="keyCandidates" name="keyCandidates" rows="3" placeholder="例：自動判定を見て、最終軸を手書き"></textarea>
        </label>
        <label>
          相手候補メモ
          <textarea id="opponentCandidates" name="opponentCandidates" rows="3" placeholder="例：1, 3, 5, 8"></textarea>
        </label>
        <label>
          買い目メモ
          <textarea id="bettingMemo" name="bettingMemo" rows="5" placeholder="例：馬連 7-1,3,5 / 三連複 7-10-1,3,5"></textarea>
        </label>
      </section>

      <div class="actions">
        <button type="submit" class="primary">保存する</button>
        <button type="button" id="clearButton" class="secondary">入力をクリア</button>
      </div>
      <p id="statusMessage" class="status" role="status" aria-live="polite"></p>
    </form>

    <aside class="card saved-card">
      <div class="saved-header">
        <h2>保存済みメモ</h2>
        <button type="button" id="deleteButton" class="danger">保存データ削除</button>
      </div>
      <dl id="savedSummary" class="summary"></dl>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
